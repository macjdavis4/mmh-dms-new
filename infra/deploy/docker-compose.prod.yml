# Runs on the Droplet in /opt/mmh. Managed only by deploy.sh / rollback.sh.
# Image tags live in ${MMH_HOME:-/opt/mmh}/state.env; secrets in ${MMH_HOME:-/opt/mmh}/.env (0600).
name: mmh

x-app: &app
  env_file:
    - "${MMH_HOME:-/opt/mmh}/.env"
  restart: unless-stopped
  user: "10001:10001"
  read_only: true
  tmpfs: ["/tmp:size=256m"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  volumes:
    - "${MMH_HOME:-/opt/mmh}/certs:/certs:ro"
  networks: [app]
  # To the server's journal, which the logship service copies off-site.
  # (`docker logs` still works.)
  logging:
    driver: journald
    options: { tag: "{{.Name}}" }

services:
  caddy:
    image: ${CADDY_IMAGE}
    # Only what the Caddyfile reads. The internet-facing proxy never gets the
    # database, storage or Django secrets (deploy.sh exports these from .env).
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - "${MMH_HOME:-/opt/mmh}/upstream:/etc/caddy/upstream:ro"
      - caddy_data:/data
      - caddy_config:/config
    networks: [app]
    logging:
      driver: journald
      options: { tag: "{{.Name}}" }

  app-blue:
    <<: *app
    image: ${BLUE_IMAGE:-none}
    command: ["web"]

  app-green:
    <<: *app
    image: ${GREEN_IMAGE:-none}
    command: ["web"]

  worker:
    <<: *app
    image: ${WORKER_IMAGE:-none}
    command: ["worker"]
    environment:
      # Workers use the direct connection (LISTEN/NOTIFY and pg_dump
      # snapshots don't work through PgBouncer's transaction mode).
      DATABASE_URL: ${DATABASE_DIRECT_URL_FOR_WORKER:-}
      DB_BEHIND_POOLER: "false"
    stop_grace_period: 120s
    healthcheck:
      disable: true

  migrate:
    <<: *app
    image: ${MIGRATE_IMAGE:-none}
    command: ["migrate"]
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_MIGRATE_URL:-}
      DB_BEHIND_POOLER: "false"
      APP_DB_ROLE: ${APP_DB_ROLE:-}
    healthcheck:
      disable: true
    profiles: ["tools"]

  # Copies the server's logs to the locked off-site bucket (vector.yaml).
  # Started by deploy.sh when OFFSITE_BUCKET is set. It only reads the journal
  # and has its own network: it can't reach the app or the database.
  logship:
    image: ${LOGSHIP_IMAGE:-timberio/vector:0.58.0-debian}
    command: ["--config", "/etc/vector/vector.yaml"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      AWS_ACCESS_KEY_ID: ${OFFSITE_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${OFFSITE_SECRET_ACCESS_KEY:-}
    volumes:
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      # Written by deploy.sh from vector.yaml (render_logship_config).
      - ./vector.rendered.yaml:/etc/vector/vector.yaml:ro
      - logship_data:/var/lib/vector
    networks: [logs]
    logging:
      driver: journald
      options: { tag: "{{.Name}}" }
    profiles: ["logship"]

networks:
  app: {}
  logs: {}

volumes:
  # Caddy's certificates. Losing them is harmless (re-issued automatically).
  caddy_data:
  caddy_config:
  # Vector's place in the journal and logs waiting to be sent.
  logship_data:
