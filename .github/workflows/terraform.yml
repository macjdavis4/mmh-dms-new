# Plan or apply infrastructure changes. Run by hand from the Actions tab:
# Actions -> Terraform -> Run workflow -> pick environment and action.
#
# Every run waits for approval: it uses the "terraform" GitHub environment,
# which alone holds the full-access DigitalOcean token, the full-access Spaces
# key and the Cloudflare Terraform token. Deploys use limited keys instead
# (docs/MANUAL_STEPS.md, "Security audit"), so a bad workflow change merged to
# main can't delete the database or the backups without someone approving it.
# Its settings (CLOUDFLARE_ZONE_ID, SSH keys, ADMIN_SSH_CIDRS, ALERT_EMAILS) are
# repository variables; STAGING_/PRODUCTION_DROPLET_SIZE optionally override
# the Droplet size per environment.
name: Terraform

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which stack
        type: choice
        options: [staging, production, shared]
        required: true
      action:
        description: plan shows changes; apply makes them
        type: choice
        options: [plan, apply]
        default: plan
      replace:
        description: "Optional: rebuild one resource, e.g. module.app.digitalocean_droplet.app"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy # never at the same time as a deploy (shared firewall rules)
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-24.04
    environment: terraform
    defaults:
      run:
        working-directory: infra/terraform/envs/${{ inputs.environment }}
    env:
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      SPACES_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
      SPACES_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.TERRAFORM_CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
      TF_VAR_admin_ssh_public_key: ${{ vars.ADMIN_SSH_PUBLIC_KEY }}
      TF_VAR_deploy_ssh_public_key: ${{ vars.DEPLOY_SSH_PUBLIC_KEY }}
      TF_VAR_admin_ssh_cidrs: ${{ vars.ADMIN_SSH_CIDRS }}
      TF_VAR_alert_emails: ${{ vars.ALERT_EMAILS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.5"
      - name: Optional size overrides (repository variables)
        env:
          TARGET: ${{ inputs.environment }}
          STAGING_DROPLET_SIZE: ${{ vars.STAGING_DROPLET_SIZE }}
          PRODUCTION_DROPLET_SIZE: ${{ vars.PRODUCTION_DROPLET_SIZE }}
        run: |
          case "$TARGET" in
            staging) DROPLET_SIZE=$STAGING_DROPLET_SIZE ;;
            production) DROPLET_SIZE=$PRODUCTION_DROPLET_SIZE ;;
            *) DROPLET_SIZE="" ;;
          esac
          # Only set when the variable exists; otherwise the Terraform default applies.
          if [ -n "$DROPLET_SIZE" ]; then
            [[ "$DROPLET_SIZE" =~ ^[a-z0-9-]{3,40}$ ]] || { echo "invalid DROPLET_SIZE"; exit 1; }
            echo "TF_VAR_droplet_size=$DROPLET_SIZE" >> "$GITHUB_ENV"
          fi
      - run: terraform init -input=false
      - name: Plan
        if: inputs.environment != 'shared'
        env:
          REPLACE: ${{ inputs.replace }}
        run: |
          if [ -n "$REPLACE" ]; then
            [[ "$REPLACE" =~ ^[A-Za-z0-9_.\[\]\"-]+$ ]] || { echo "invalid resource address"; exit 1; }
            terraform plan -input=false -out=tfplan -replace="$REPLACE"
          else
            terraform plan -input=false -out=tfplan
          fi
      - name: Plan (shared needs only the zone id)
        if: inputs.environment == 'shared'
        run: terraform plan -input=false -out=tfplan -var "cloudflare_zone_id=$TF_VAR_cloudflare_zone_id"
      - name: Apply
        if: inputs.action == 'apply'
        run: terraform apply -input=false tfplan
