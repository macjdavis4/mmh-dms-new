# Monthly proof that backups can be restored: download the newest encrypted
# dump from the second-region bucket, decrypt it, restore it into a throwaway
# Postgres, and compare every table's row count with the count recorded when
# the backup was taken. Also fails if the newest backup is more than two days
# old. On failure GitHub emails the repository admins and an issue is opened.
name: Restore test

on:
  schedule:
    - cron: "17 10 3 * *" # 3rd of each month, ~6 AM in Bangor
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  restore:
    if: vars.DEPLOY_ENABLED == 'true'
    strategy:
      fail-fast: false
      matrix:
        target: [staging, production]
    runs-on: ubuntu-24.04
    environment: restore-test-${{ matrix.target }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: restore
          POSTGRES_PASSWORD: restore
          POSTGRES_DB: restore
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U restore" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.RESTORE_SPACES_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.RESTORE_SPACES_SECRET }}
      AWS_DEFAULT_REGION: us-east-1
      ENDPOINT: ${{ vars.BACKUP_ENDPOINT }}
      BUCKET: ${{ vars.BACKUP_BUCKET }}
      RESTORE_URL: postgres://restore:restore@localhost:5432/restore
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq age
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-16
      - name: Find the newest backup
        run: |
          KEY=$(aws s3api list-objects-v2 --endpoint-url "$ENDPOINT" --bucket "$BUCKET" \
                  --prefix "db/${{ matrix.target }}/" --query 'sort_by(Contents,&LastModified)[-1].Key' --output text)
          echo "Newest: $KEY"
          [[ "$KEY" == *.dump.age ]] || { echo "::error::no encrypted backup found"; exit 1; }
          echo "KEY=$KEY" >> "$GITHUB_ENV"
          echo "MANIFEST=${KEY%.dump.age}.counts.json" >> "$GITHUB_ENV"
      - name: Download and decrypt
        env:
          AGE_IDENTITY: ${{ secrets.BACKUP_AGE_IDENTITY }}
        run: |
          aws s3 cp --endpoint-url "$ENDPOINT" "s3://$BUCKET/$KEY" backup.dump.age --only-show-errors
          aws s3 cp --endpoint-url "$ENDPOINT" "s3://$BUCKET/$MANIFEST" manifest.json --only-show-errors
          printf '%s\n' "$AGE_IDENTITY" > identity.txt && chmod 600 identity.txt
          age --decrypt --identity identity.txt --output backup.dump backup.dump.age
          rm -f identity.txt
      - name: Backup is recent
        run: |
          created=$(jq -r .created_at manifest.json)
          age_h=$(( ( $(date +%s) - $(date -d "$created" +%s) ) / 3600 ))
          echo "Backup taken $created ($age_h hours ago)"
          [ "$age_h" -le 48 ] || { echo "::error::newest backup is $age_h hours old"; exit 1; }
      - name: Restore
        run: pg_restore --no-owner --no-privileges --exit-on-error --dbname "$RESTORE_URL" backup.dump
      - name: Compare row counts
        run: python3 infra/scripts/verify_restore.py manifest.json "$RESTORE_URL"
      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Backup restore test FAILED (${{ matrix.target }})`,
              body: `The monthly restore test failed for **${{ matrix.target }}**.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nSee docs/RUNBOOK.md, "Backup or restore test failed".`,
              labels: ["backup", "urgent"],
            });
