name: Deploy to a Droplet
description: >
  Reads Terraform outputs, opens SSH to this runner for the length of the job,
  sends the environment file and runs the blue/green deploy on the Droplet.

inputs:
  environment:
    description: staging or production
    required: true
  image-tag:
    description: App image tag (git SHA)
    required: true
  terraform-version:
    required: false
    default: "1.16.5"

runs:
  using: composite
  steps:
    - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
      with:
        terraform_version: ${{ inputs.terraform-version }}
        terraform_wrapper: false

    - name: Read infrastructure outputs
      shell: bash
      working-directory: infra/terraform/envs/${{ inputs.environment }}
      run: |
        terraform init -input=false >/dev/null
        terraform output -json > "$RUNNER_TEMP/tf.json"
        echo "DROPLET_IP=$(jq -r .droplet_ip.value "$RUNNER_TEMP/tf.json")" >> "$GITHUB_ENV"
        echo "FIREWALL_ID=$(jq -r .firewall_id.value "$RUNNER_TEMP/tf.json")" >> "$GITHUB_ENV"
        echo "SITE_HOST=$(jq -r .hostname.value "$RUNNER_TEMP/tf.json")" >> "$GITHUB_ENV"

    - uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
      with:
        token: ${{ env.DIGITALOCEAN_ACCESS_TOKEN }}

    - name: Allow SSH from this runner (temporary)
      shell: bash
      run: |
        # Ask more than one service: a runner can show different public
        # addresses to different sites. Open SSH for every one we see.
        ips=""
        for svc in https://api.ipify.org https://checkip.amazonaws.com https://ifconfig.me/ip; do
          ip=$(curl -fsS --max-time 10 "$svc" 2>/dev/null | tr -d '[:space:]' || true)
          if [[ "$ip" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]] && ! grep -qw "$ip" <<<"$ips"; then ips="$ips $ip"; fi
        done
        [ -n "$ips" ] || { echo "::error::could not work out this runner's public IP"; exit 1; }
        echo "RUNNER_IPS=${ips# }" >> "$GITHUB_ENV"
        echo "Runner addresses:${ips}"
        for ip in $ips; do
          doctl compute firewall add-rules "$FIREWALL_ID" --inbound-rules "protocol:tcp,ports:22,address:$ip/32"
        done
        # Wait (up to 2.5 minutes) until the firewall change is live.
        for _ in $(seq 1 30); do
          if timeout 5 bash -c "exec 3<>/dev/tcp/$DROPLET_IP/22" 2>/dev/null; then
            echo "SSH port is reachable"; exit 0
          fi
          sleep 5
        done
        echo "::error::SSH port 22 on the server never became reachable from this runner"
        echo "Firewall inbound rules now:"
        doctl compute firewall get "$FIREWALL_ID" --format InboundRules --no-header || true
        exit 1

    - name: Blue/green deploy
      shell: bash
      run: |
        install -m 700 -d ~/.ssh
        printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
        printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts
        python3 infra/scripts/build_env.py < "$RUNNER_TEMP/tf.json" \
          | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
              -o ServerAliveInterval=15 "deploy@$DROPLET_IP" "deploy ${{ inputs.image-tag }}"

    - name: Remove the temporary SSH rule
      if: always()
      shell: bash
      run: |
        rm -f ~/.ssh/deploy_key "$RUNNER_TEMP/tf.json"
        # A rule left behind leaves SSH open to a shared cloud address, so a
        # failed removal fails the run (and shows up red) instead of passing quietly.
        left=""
        for ip in ${RUNNER_IPS:-}; do
          removed=0
          for _ in 1 2 3; do
            if doctl compute firewall remove-rules "$FIREWALL_ID" --inbound-rules "protocol:tcp,ports:22,address:$ip/32"; then
              removed=1; break
            fi
            sleep 5
          done
          [ "$removed" = 1 ] || left="$left $ip"
        done
        if [ -n "$left" ]; then
          echo "::error::Could not remove the temporary SSH rule for:$left. Remove it by hand: DigitalOcean > Networking > Firewalls (see docs/RUNBOOK.md)."
          exit 1
        fi

    - name: Check the live site from outside
      shell: bash
      run: |
        for _ in $(seq 1 20); do
          body=$(curl -fsS "https://$SITE_HOST/readyz" || true)
          if echo "$body" | grep -q "\"version\": \"${{ inputs.image-tag }}\""; then
            echo "Live: $body"; exit 0
          fi
          sleep 5
        done
        echo "::error::https://$SITE_HOST/readyz is not serving ${{ inputs.image-tag }}"; exit 1
