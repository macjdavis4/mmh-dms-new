version: 2
updates:
  - package-ecosystem: pip
    directory: /backend/requirements
    schedule: { interval: weekly }
    groups:
      python-minor: { update-types: [minor, patch] }
    # Django stays on the long-term-support release (5.2 until April 2028).
    # Only its security and bug-fix patches come through here; moving to the
    # next LTS (6.2) is a planned upgrade, not a Dependabot bump.
    ignore:
      - dependency-name: django
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: django-stubs
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: django-stubs-ext
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      npm-minor: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directory: /infra/caddy
    schedule: { interval: monthly }
  - package-ecosystem: terraform
    directory: /infra/terraform/envs/production
    schedule: { interval: monthly }
